<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Shooter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <h1>🚀 Space Shooter</h1>
        <div class="score-bar"><span>Score: <strong id="score">0</strong></span><span>Lives: <strong id="lives">3</strong></span><span>Wave: <strong id="wave">1</strong></span></div>
        <canvas id="gameCanvas" width="480" height="600"></canvas>
        <p>← → Move | Space to shoot</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
