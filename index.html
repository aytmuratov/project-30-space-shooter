<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Shooter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="game"></canvas>
    <div id="hud">
        <span id="score">Score: 0</span>
        <span id="wave">Wave: 1</span>
        <span id="lives">Lives: ♥♥♥</span>
    </div>
    <div id="start-screen">
        <h1>Galaxy Defender</h1>
        <p>Destroy enemies, collect power-ups!</p>
        <p class="controls">Arrow Keys: Move | Space: Shoot</p>
        <button id="start-btn">Launch</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
